spring.application.name=foodywoody

# --- Default: in-memory H2, zero setup required ---
spring.datasource.url=jdbc:h2:mem:foodywoody;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- To use MySQL instead, comment the H2 block above and uncomment below ---
#spring.datasource.url=jdbc:mysql://localhost:3306/foodywoody?createDatabaseIfNotExist=true
#spring.datasource.username=root
#spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
server.port=8080
