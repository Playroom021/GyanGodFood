<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='My Orders')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<section class="section container">
    <div class="section-title"><span>My orders</span></div>

    <div class="panel" th:if="${!orders.isEmpty()}">
        <table>
            <thead><tr><th>Order</th><th>Placed</th><th>Status</th><th>Total</th><th></th></tr></thead>
            <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="'#' + ${o.id}">#1</td>
                    <td th:text="${#temporals.format(o.placedAt, 'dd MMM, HH:mm')}">date</td>
                    <td><span class="badge" th:classappend="'badge-' + ${o.status}" th:text="${o.status}">PLACED</span></td>
                    <td th:text="${'$' + #numbers.formatDecimal(o.totalAmount, 1, 2)}">$0.00</td>
                    <td><a th:href="@{/orders/{id}(id=${o.id})}" style="color:var(--primary);font-weight:600;">View</a></td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-state" th:if="${orders.isEmpty()}">
        <div class="emoji">📦</div>
        <p>You haven't placed any orders yet.</p>
        <a th:href="@{/menu}" class="btn btn-primary" style="margin-top:12px;">Browse the menu</a>
    </div>
</section>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
