<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='Sign up')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<section class="form-page">
    <div class="form-card">
        <h2>Create your account</h2>

        <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" th:object="${registerForm}" method="post">
            <div class="field">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" th:field="*{fullName}"/>
                <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}"/>
                <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="field">
                <label for="phone">Phone (optional)</label>
                <input type="text" id="phone" th:field="*{phone}"/>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}"/>
                <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Sign up</button>
        </form>
        <p class="form-footer-link">Already have an account? <a th:href="@{/login}" style="color:var(--primary);font-weight:600;">Log in</a></p>
    </div>
</section>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
