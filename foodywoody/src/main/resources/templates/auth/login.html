<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='Log in')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<section class="form-page">
    <div class="form-card">
        <h2>Welcome back</h2>

        <div class="alert alert-success" th:if="${param.registered != null}">Account created &mdash; please log in.</div>
        <div class="alert alert-error" th:if="${param.error != null}">Invalid email or password.</div>
        <div class="alert alert-success" th:if="${param.logout != null}">You've been logged out.</div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">Email</label>
                <input type="email" id="username" name="username" required autofocus/>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required/>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Log in</button>
        </form>
        <p class="form-footer-link">New here? <a th:href="@{/register}" style="color:var(--primary);font-weight:600;">Create an account</a></p>
        <p class="form-footer-link" style="margin-top:-6px;">Admin demo: admin@foodywoody.com / Admin@123</p>
    </div>
</section>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
