<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='Product Form')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<section class="form-page">
    <div class="form-card">
        <h2 th:text="${product.id == null} ? 'Add product' : 'Edit product'">Product</h2>
        <form th:action="@{/admin/products}" th:object="${product}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}"/>
                <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>
            <div class="field">
                <label for="description">Description</label>
                <textarea id="description" rows="3" th:field="*{description}"></textarea>
                <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>
            <div class="field">
                <label for="price">Price</label>
                <input type="number" step="0.01" id="price" th:field="*{price}"/>
                <div class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>
            <div class="field">
                <label for="category">Category</label>
                <select id="category" th:field="*{category}">
                    <option th:each="c : ${categories}" th:value="${c}" th:text="${c.icon} + ' ' + ${c.label}"></option>
                </select>
            </div>
            <div class="field">
                <label><input type="checkbox" th:field="*{available}" style="width:auto;"/> Available on menu</label>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Save product</button>
        </form>
    </div>
</section>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
