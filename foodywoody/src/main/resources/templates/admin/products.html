<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='Manage Products')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>

<section class="section container">
    <div class="admin-toolbar">
        <div class="section-title" style="margin:0;"><span>Products</span></div>
        <a th:href="@{/admin/products/new}" class="btn btn-primary btn-small">+ Add product</a>
    </div>

    <div class="panel">
        <table>
            <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Available</th><th></th></tr></thead>
            <tbody>
                <tr th:each="p : ${products}">
                    <td th:text="${p.name}">Name</td>
                    <td th:text="${p.category.icon} + ' ' + ${p.category.label}">Category</td>
                    <td th:text="${'$' + #numbers.formatDecimal(p.price, 1, 2)}">$0.00</td>
                    <td th:text="${p.available} ? 'Yes' : 'No'">Yes</td>
                    <td style="display:flex;gap:8px;">
                        <a th:href="@{/admin/products/{id}/edit(id=${p.id})}" class="btn btn-secondary btn-small">Edit</a>
                        <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" onsubmit="return confirm('Delete this product?');">
                            <button type="submit" class="btn btn-danger btn-small">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</section>

<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
